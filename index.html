    async clear(c) { const { error } = await sb().from(spec(c)[0]).delete().neq('id', '__none__'); if (error) fail(error); },
    /** Admin: delete log / email-queue rows older than N days (email queue: only sent or failed ones). */
    async purgeOld(c, days, statuses) { const col = c === 'activityLog' ? 'at' : 'created_at'; let q = sb().from(spec(c)[0]).delete().lt(col, new Date(Date.now() - days * 864e5).toISOString()); if (statuses) q = q.in('status', statuses); const { data, error } = await q.select('id'); if (error) fail(error); return (data || []).length; },
    async wipe() { throw new Error('Not available with Supabase. Manage data from the Supabase dashboard.'); },
    async exportAll() { const out = { app: 'PetCare', version: Config.dataVersion, source: 'supabase', exportedAt: new Date().toISOString(), data: {} }; for (const c of Object.keys(SB_SCHEMA)) { try { out.data[c] = await this.getAll(c); } catch (e) { out.data[c] = []; } } return out; },
    async importAll() { throw new Error('Restoring into Supabase is done from the Supabase dashboard (Database → Backups).'); },
    async rpc(name, args) { const { data, error } = await sb().rpc(name, args); if (error) fail(error); return /reserv/.test(name) ? fromRow('reservations', data) : data; },
    kv: {
      SHARED: ['clinic', 'app', 'enableReservations', 'about', 'payments'], // shared settings live in the database; cart/drafts stay in this browser
      async get(key, fallback = null) { if (!this.SHARED.includes(key)) { try { const v = localStorage.getItem('petcare:kv:' + key); return v == null ? fallback : JSON.parse(v); } catch (e) { return fallback; } } const C = Backend.settingsCache; if (C) return ('kv:' + key) in C ? C['kv:' + key] : fallback; const r = await api.get('settings', 'kv:' + key); return r ? r.value : fallback; },
      async set(key, value) { if (!this.SHARED.includes(key)) { try { localStorage.setItem('petcare:kv:' + key, JSON.stringify(value)); } catch (e) { /* ignore */ } return; } const r = await api.put('settings', { id: 'kv:' + key, value, updatedAt: Date.now() }); if (Backend.settingsCache) Backend.settingsCache['kv:' + key] = JSON.parse(JSON.stringify(value)); return r; },
      async del(key) { if (!this.SHARED.includes(key)) { try { localStorage.removeItem('petcare:kv:' + key); } catch (e) { /* ignore */ } return; } if (Backend.settingsCache) delete Backend.settingsCache['kv:' + key]; return api.remove('settings', 'kv:' + key); }
    },
    friendly, fromRow
  };
  return api;
})();

/* ---------- The DB facade every screen uses ---------- */
const DB = {
  mode: 'local', impl: LocalDB,
  use(m) { this.mode = m; this.impl = m === 'supabase' ? SupaDB : LocalDB; },
  getAll(c) { return this.impl.getAll(c); }, get(c, id) { return this.impl.get(c, id); },
  put(c, o) { return this.impl.put(c, o); }, add(c, o) { return this.impl.add(c, o); },
  update(c, id, p) { return this.impl.update(c, id, p); }, remove(c, id) { return this.impl.remove(c, id); },
  query(c, f, s) { return this.impl.query(c, f, s); }, count(c, f) { return this.impl.count(c, f); },
  clear(c) { return this.impl.clear(c); }, purgeOld(c, d, st) { return this.impl.purgeOld(c, d, st); }, wipe() { return this.impl.wipe(); },
  exportAll() { return this.impl.exportAll(); }, importAll(j) { return this.impl.importAll(j); },
  rpc(name, args) { return SupaDB.rpc(name, args); },
  kv: { get(k, f) { return DB.impl.kv.get(k, f); }, set(k, v) { return DB.impl.kv.set(k, v); }, del(k) { return DB.impl.kv.del(k); } }
};

/* ---------- Supabase Auth (replaces the local Auth methods in Supabase mode) ---------- */
const SupaAuth = {
  async loadProfile(u) {
    let p = await DB.get('users', u.id);
    for (let i = 0; !p && i < 4; i++) { await Util.sleep(400); p = await DB.get('users', u.id); }
    if (!p) throw new Error('Your profile could not be loaded. Please try again.');
    if (p.active === false) { await Backend.sb.auth.signOut(); this.user = null; throw new Error('This account is disabled. Please contact the clinic.'); }
    p.email = p.email || u.email; this.user = p; return p;
  },
  async init() {
    const { data } = await Backend.sb.auth.getSession();
    if (data && data.session) { try { await this.loadProfile(data.session.user); } catch (e) { this.user = null; } }
    Backend.sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT' && this.user) { this.user = null; Router.resolve(); } });
  },
  async findByEmail(email) { const e = String(email || '').trim().toLowerCase(); try { return (await DB.query('users', u => u.email === e))[0] || null; } catch (err) { return null; } },
  async login(email, pw) {
    const e = String(email).trim().toLowerCase();
    const { data, error } = await Backend.sb.auth.signInWithPassword({ email: e, password: pw });
    if (error) {
      if (error.code === 'email_not_confirmed' || /not confirmed/i.test(error.message)) return { ok: false, needsVerify: true, user: { email: e }, msg: 'Please verify your email first.' };
      if (error.code === 'invalid_credentials' || /invalid login/i.test(error.message)) return { ok: false, msg: 'Incorrect email or password. Please try again.' };
      return { ok: false, msg: SupaDB.friendly(error) };
    }
    try { const p = await this.loadProfile(data.user); try { this.user = await DB.update('users', p.id, { lastLogin: Date.now() }); } catch (x) { /* not critical */ } await Log.add('Signed in', p.email, p); return { ok: true, user: this.user }; }
    catch (err) { return { ok: false, msg: err.message }; }
  },
  async logout() { const u = this.user; this.user = null; if (u) await Log.add('Signed out', u.email, u); try { await Backend.sb.auth.signOut({ scope: 'local' }); } catch (e) { console.warn('Sign-out:', e.message); } },
  async refresh() { if (this.user) { const p = await DB.get('users', this.user.id); if (p) this.user = { ...p, email: p.email || this.user.email }; } },
  async register(d) {
    const email = d.email.trim().toLowerCase();
    const { data, error } = await Backend.sb.auth.signUp({ email, password: d.password, options: { data: { name: d.name.trim(), mobile: d.mobile.trim(), municipality: d.municipality, address: d.address || '', consent_at: new Date().toISOString() } } });
    if (error) throw new Error(/already registered|already exists/i.test(error.message) ? 'An account with this email already exists. Please sign in.' : /hook|sending|smtp|confirmation email/i.test(error.message) ? 'We could not send the verification email right now. Please try again in a few minutes or call the clinic.' : SupaDB.friendly(error));
    if (data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) throw new Error('An account with this email already exists. Please sign in.');
    this.markSent(email);
    if (data.session) { await this.loadProfile(data.user); return { email, verified: true }; }
    return { email };
  },
  markSent(email) { try { localStorage.setItem('petcare:otp:' + email, String(Date.now())); } catch (e) { /* ignore */ } },
  async otpStatus(email) { let sent = 0; try { sent = +localStorage.getItem('petcare:otp:' + email) || 0; } catch (e) { /* ignore */ } return { exists: true, verified: false, expires: (sent || Date.now()) + Config.otp.ttlMin * 60000, lastSent: sent }; },
  async sendOtp(u) {
    const email = String(u.email || u).toLowerCase();
    const { error } = await Backend.sb.auth.resend({ type: 'signup', email });
    if (error) throw new Error(/second|rate|limit/i.test(error.message) ? 'Please wait a minute before asking for another code.' : SupaDB.friendly(error));
    this.markSent(email); UI.toast('Code sent to ' + email, 'Check your inbox and spam folder.', 'mail');
  },
  async resend(email) { return this.sendOtp({ email }); },
  async verifyOtp(email, code) {
    let res = await Backend.sb.auth.verifyOtp({ email, token: String(code), type: 'email' });
    if (res.error) { const r2 = await Backend.sb.auth.verifyOtp({ email, token: String(code), type: 'signup' }); if (!r2.error) res = r2; }
    if (res.error) { const m = res.error.message || ''; return { ok: false, expired: /expired/i.test(m), msg: /expired|invalid|token/i.test(m) ? 'That code is incorrect or has expired. Use the newest email or request a new code.' : SupaDB.friendly(res.error) }; }
    const p = await this.loadProfile(res.data.user); await Log.add('Verified email', p.email, p);
    await EmailService.send(p.email, 'Welcome to PetCare', `Hi ${p.name},\n\nYour account is now active. You can add your pets and book appointments online.` + EmailService.sign(), { silent: true });
    return { ok: true, user: p };
  },
  async changePassword(oldPw, newPw) {
    const { error: e1 } = await Backend.sb.auth.signInWithPassword({ email: this.user.email, password: oldPw });
    if (e1) throw new Error('Your current password is incorrect.');
    const { error } = await Backend.sb.auth.updateUser({ password: newPw }); if (error) throw new Error(SupaDB.friendly(error));
    await Log.add('Changed password');
  },
  async sendReset(email) { const { error } = await Backend.sb.auth.resetPasswordForEmail(String(email).trim().toLowerCase()); if (error && /second|rate|limit/i.test(error.message)) throw new Error('Please wait a minute before asking for another code.'); },
  async resetWithCode(email, code, newPw) {
    const { data, error } = await Backend.sb.auth.verifyOtp({ email: String(email).trim().toLowerCase(), token: String(code), type: 'recovery' });
    if (error) throw new Error('That code is incorrect or has expired. Please request a new one.');
    const { error: e2 } = await Backend.sb.auth.updateUser({ password: newPw }); if (e2) throw new Error(SupaDB.friendly(e2));
    const p = await this.loadProfile(data.user); await Log.add('Reset password', p.email, p); return p;
  }
};
/* Any unexpected error: friendly message instead of a silent failure */
window.addEventListener('unhandledrejection', e => {
  const msg = SupaDB.friendly(e.reason);
  try { Anim.procHide(); $$('.btn.loading').forEach(b => UI.busy(b, false)); UI.toast('Something went wrong', msg, 'err'); } catch (x) { /* UI not ready */ }
});

/** Sign out, then always redraw (the header kept showing the account when you were already on Home). */
async function signOutHome() {
  try { await Auth.logout(); } catch (e) { console.warn('Sign-out:', e.message); Auth.user = null; }
  try { localStorage.removeItem('petcare-auth'); } catch (e) { /* ignore */ }
  UI.toast('Signed out', 'See you and your pet soon!', 'ok');

async function loadSettings() {
  const clinic = await DB.kv.get('clinic'); if (clinic) { if (!clinic.mapEmbed || clinic.mapEmbed === Config.clinic.mapEmbedLegacy || clinic.mapEmbed === Config.clinic.mapEmbedOld) { clinic.mapEmbed = DEFAULTS.clinic.mapEmbed; clinic.lat = DEFAULTS.clinic.lat; clinic.lng = DEFAULTS.clinic.lng; } Object.assign(Config.clinic, clinic); }
  const app = await DB.kv.get('app'); if (app) Object.assign(Config.app, app);
  const r = await DB.kv.get('enableReservations'); if (r !== null) Config.enableReservations = r;
  const ab = await DB.kv.get('about'); if (ab) Config.about = { ...Config.about, ...ab };
  const pm = await DB.kv.get('payments'); if (Array.isArray(pm) && pm.length) Config.paymentMethods = pm;
}
/** Initials for a team card: first name + last name, skipping titles and suffixes (Jr., III). */
function teamInitials(n) { const w = String(n || '').replace(/,/g, ' ').trim().split(/\s+/).filter(x => !/^(dr|dra|doc|mr|mrs|ms|jr|sr|ii|iii|iv)\.?$/i.test(x) && !/^[A-Z]\.$/.test(x)); return ((w[0] || '?')[0] + (w.length > 1 ? w[w.length - 1][0] : '')).toUpperCase(); }

/* Reminders: a due reminder creates one email (once). Runs whenever a signed-in user opens the app (staff: all pets; owners: their own). */
const Reminders = {
  async process() {
    if (!Auth.user) return 0; // owners process their own, staff process everyone's
    const lead = Util.addDays(Util.today(), Config.app.reminderLeadDays);
    const due = await DB.query('reminders', r => !r.done && !r.emailed && r.dueDate <= lead);
    for (const r of due) {
      const [owner, pet] = await Promise.all([DB.get('users', r.ownerId), DB.get('pets', r.petId)]);
      if (owner && pet) await EmailService.send(owner.email, `Reminder: ${pet.name}'s ${r.title} is due ${Util.fmtDate(r.dueDate)}`, `Hi ${owner.name},\n\nThis is a friendly reminder that ${pet.name}'s ${r.title.toLowerCase()} is due on ${Util.fmtDate(r.dueDate)}.\nBook online at your convenience or call us.` + EmailService.sign(), { silent: true, kind: 'reminder' });
      await DB.update('reminders', r.id, { emailed: true, emailedAt: Date.now() });
    }
    let n = due.length;
    if (Auth.isStaff && Auth.isStaff()) { try { n += await this.appointments(); } catch (e) { console.warn('Appointment automation skipped:', e.message); } }
    return n;
  },
  /** Staff side: appointment reminders, unpaid-booking reminders and auto-cancel (each email is sent once, tracked in the appointment). */
  async appointments() {
    const A = Config.app, now = Date.now(), H = 3600000, at = a => Util.parse(a.date).getTime() + Util.toMin(a.time) * 60000;
    const [appts, pays, svcs] = await Promise.all([DB.query('appointments', a => ['Pending', 'Confirmed'].includes(a.status) && at(a) > now), DB.getAll('payments'), DB.getAll('services')]);
    let n = 0;
    for (const a of appts) {
      const left = (at(a) - now) / H, pay = pays.find(p => p.appointmentId === a.id), unpaid = !pay || ['Unpaid', 'Rejected'].includes(pay.status) && pay.method !== 'Cash';
      const owner = await DB.get('users', a.ownerId), pet = await DB.get('pets', a.petId); if (!owner || !pet) continue;
      const svc = svcName(svcs, a.serviceKey), when = `${Util.fmtDate(a.date)} at ${Util.fmtTime(a.time)}`, hist = t => [...(a.history || []), { at: now, by: 'PetCare', text: t }];
      if (A.autoCancelHours && unpaid && left <= A.autoCancelHours) {
        await DB.update('appointments', a.id, { status: 'Cancelled', cancelReason: 'Not paid before the deadline', cancelledBy: 'clinic', history: hist('Auto-cancelled: unpaid') });
        await EmailService.send(owner.email, `Booking cancelled (unpaid): ${svc} for ${pet.name}`, `Hi ${owner.name},

Your ${svc} booking for ${pet.name} on ${when} was cancelled because no payment was received ${A.autoCancelHours} hours before the appointment.
You can book a new slot anytime online.` + EmailService.sign(), { silent: true, kind: 'booking' });
        await Log.add('Auto-cancelled unpaid booking', `${a.id} · ${pet.name}`); n++; continue;
      }
      if (A.payReminderHours && unpaid && left <= A.payReminderHours && !a.payReminded) {
        await DB.update('appointments', a.id, { payReminded: now, history: hist('Payment reminder emailed') });
        await EmailService.send(owner.email, `Payment needed: ${svc} for ${pet.name}`, `Hi ${owner.name},

We have not received payment for ${pet.name}'s ${svc} on ${when} (${Util.money(a.price)}).
Please pay in My Payments to keep your slot.${A.autoCancelHours ? ` Unpaid bookings are cancelled ${A.autoCancelHours} hours before the appointment.` : ''}` + EmailService.sign(), { silent: true, kind: 'booking' }); n++;
      }
      if (A.apptReminderHours && a.status === 'Confirmed' && left <= A.apptReminderHours && !a.apptReminded) {
        await DB.update('appointments', a.id, { apptReminded: now, history: hist('Appointment reminder emailed') });
        await EmailService.send(owner.email, `Reminder: ${pet.name}'s ${svc} on ${when}`, `Hi ${owner.name},

See you soon! ${pet.name}'s ${svc} is on ${when} at ${Config.clinic.address}.
Show your check-in QR (My appointments) when you arrive. Please come 10 minutes early.` + EmailService.sign(), { silent: true, kind: 'booking' }); n++;
      }
    }
    return n;
  },
  async createFromDue(petId, ownerId, type, title, dueDate) {
    if (!dueDate) return;
    const dup = await DB.query('reminders', r => r.petId === petId && r.title === title && !r.done);
    for (const d of dup) await DB.update('reminders', d.id, { done: true });
    await DB.add('reminders', { petId, ownerId, type, title, dueDate, emailed: false, done: false });
  }
};

/* =====================================================================
   CART (reservation list) — kept through sign-in
   ===================================================================== */
const Cart = {
  async items() { return (await DB.kv.get('cart', [])) || []; },
  async save(list) { await DB.kv.set('cart', list); await this.badge(true); },
  async add(pid, qty = 1, fromEl) {
    const p = await DB.get('products', pid); if (!p) return;
    const list = await this.items(); const it = list.find(x => x.productId === pid); const cur = it ? it.qty : 0;
    if (cur + qty > p.stock) return UI.toast('Not enough stock', p.stock > 0 ? `Only ${p.stock} left for ${p.name}.` : `${p.name} is out of stock.`, 'err');
    if (it) it.qty += qty; else list.push({ productId: pid, qty });
    if (fromEl) Anim.flyToCart(fromEl);
    await this.save(list); UI.toast('Added to reservation list', p.name, 'ok', 2600);
  },
  async setQty(pid, qty) { const list = await this.items(); const it = list.find(x => x.productId === pid); if (!it) return; const p = await DB.get('products', pid); it.qty = Math.max(1, Math.min(qty, p ? p.stock : qty)); await this.save(list); },
  async remove(pid) { await this.save((await this.items()).filter(x => x.productId !== pid)); },
  async clear() { await this.save([]); },
  async detailed() { const list = await this.items(); const out = []; for (const it of list) { const p = await DB.get('products', it.productId); if (p) out.push({ ...it, p, price: p.salePrice || p.price }); } return out; },
  async badge(bump) { const n = (await this.items()).reduce((s, x) => s + x.qty, 0); const el = $('#cartCount'); if (!el) return; el.textContent = n; el.classList.toggle('hidden', !n); if (bump && n) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); } },
  async render() {
    const d = $('#cartDrawer'); const items = await this.detailed(); const total = items.reduce((s, x) => s + x.price * x.qty, 0);
    d.innerHTML = `<div class="drawer-hd"><h3>Reservation list</h3><button class="btn btn-icon" data-close aria-label="Close">${icon('x')}</button></div>
      <div class="drawer-bd">${items.length ? `<p class="small muted mt0">Reserve items for pick-up at the clinic. No online payment — you pay when you collect.</p>` + items.map(x => `<div class="cart-item"><a class="ci-img" href="#/store/product/${x.p.id}">${productImg(x.p)}</a><div class="grow" style="min-width:0"><a href="#/store/product/${x.p.id}" style="font-weight:700;color:var(--navy);font-size:14px;display:block;line-height:1.3">${esc(x.p.name)}</a><div class="small muted">${Util.money(x.price)} each</div><div class="row mt1" style="gap:8px"><div class="qty"><button data-dec="${x.p.id}" aria-label="Decrease">−</button><input value="${x.qty}" data-q="${x.p.id}" inputmode="numeric" aria-label="Quantity"><button data-inc="${x.p.id}" aria-label="Increase">+</button></div><button class="btn btn-icon btn-sm" data-rm="${x.p.id}" aria-label="Remove">${icon('trash', 'sm')}</button></div></div><b class="price-tag" style="font-size:15px">${Util.money(x.price * x.qty)}</b></div>`).join('') : UI.empty('Your list is empty', 'Browse the store and tap the bag icon to add items.', `<a class="btn btn-primary btn-sm" href="#/store" data-close>Browse products</a>`)}</div>
      ${items.length ? `<div class="drawer-ft"><div class="row between mb2"><span class="muted">Estimated total</span><b class="price-tag">${Util.money(total)}</b></div><a class="btn btn-primary btn-block" href="#/reserve" data-close>${icon('box', 'sm')} Reserve for pick-up</a><p class="tiny muted center mt1 mb0">${Auth.user ? 'Pay at the clinic when you pick up.' : 'You can build your list now. Sign in is needed to submit.'}</p></div>` : ''}`;
    $$('[data-close]', d).forEach(b => b.onclick = () => UI.closeDrawers());
    $$('[data-inc]', d).forEach(b => b.onclick = async () => { const it = items.find(x => x.p.id === b.dataset.inc); await this.setQty(it.p.id, it.qty + 1); this.render(); });
    $$('[data-dec]', d).forEach(b => b.onclick = async () => { const it = items.find(x => x.p.id === b.dataset.dec); if (it.qty <= 1) await this.remove(it.p.id); else await this.setQty(it.p.id, it.qty - 1); this.render(); });
    $$('[data-q]', d).forEach(i => i.onchange = async () => { const v = parseInt(i.value, 10); if (!v || v < 1) await this.remove(i.dataset.q); else await this.setQty(i.dataset.q, v); this.render(); });
    $$('[data-rm]', d).forEach(b => b.onclick = async () => { await this.remove(b.dataset.rm); this.render(); });
  },
  async open() { await this.render(); UI.openDrawer('cartDrawer'); }
};

/* ---------- Free geocoding: Esri (PH) → Nominatim → Photon ----------
   Called straight from the browser; no API keys needed. */
const Geo = {
  async get(url, ms = 7000) { const c = new AbortController(); const t = setTimeout(() => c.abort(), ms); try { const r = await fetch(url, { signal: c.signal, headers: { Accept: 'application/json' } }); if (!r.ok) throw new Error('HTTP ' + r.status); return await r.json(); } finally { clearTimeout(t); } },
  near() { return [Config.clinic.lat, Config.clinic.lng]; },
  async search(q) {
    q = String(q || '').trim(); if (q.length < 3) return [];
    const [lat, lng] = this.near(), M = Config.maps, enc = encodeURIComponent;
    try { // 1) Esri World Geocoder, Philippines only, biased to the clinic
      const d = await this.get(`${M.esriGeocoder}/findAddressCandidates?SingleLine=${enc(q)}&countryCode=PHL&maxLocations=6&location=${lng},${lat}&outFields=Match_addr&f=json`);
      const out = (d.candidates || []).filter(c => c.score >= 75).map(c => ({ label: c.address, lat: +c.location.y, lng: +c.location.x, src: 'Esri' }));
      if (out.length) return out;
    } catch (e) { /* try next */ }
    try { // 2) Nominatim (OpenStreetMap)
      const d = await this.get(`${M.nominatim}/search?format=jsonv2&countrycodes=ph&limit=6&accept-language=en&q=${enc(q)}`);
      const out = (d || []).map(x => ({ label: x.display_name, lat: +x.lat, lng: +x.lon, src: 'OpenStreetMap' }));
      if (out.length) return out;
    } catch (e) { /* try next */ }
    try { // 3) Photon (komoot)
      const d = await this.get(`${M.photon}?q=${enc(q)}&limit=8&lat=${lat}&lon=${lng}&lang=en`);
      return (d.features || []).filter(f => (f.properties.countrycode || '').toUpperCase() === 'PH').slice(0, 6).map(f => { const p = f.properties; return { label: [p.name, p.street, p.district, p.city || p.county, p.state].filter(Boolean).join(', '), lat: f.geometry.coordinates[1], lng: f.geometry.coordinates[0], src: 'Photon' }; });
    } catch (e) { return []; }
  },
  async reverse(lat, lng) {
    const M = Config.maps;
    try { const d = await this.get(`${M.esriGeocoder}/reverseGeocode?location=${lng},${lat}&langCode=en&f=json`); const a = d.address || {}; const l = a.LongLabel || a.Match_addr; if (l) return { label: l, src: 'Esri' }; } catch (e) { /* fallback */ }
    try { const d = await this.get(`${M.nominatim}/reverse?format=jsonv2&zoom=18&accept-language=en&lat=${lat}&lon=${lng}`); if (d && d.display_name) return { label: d.display_name, src: 'OpenStreetMap' }; } catch (e) { /* none */ }
    return null;
  }
};

      <div class="notice small mt2" style="text-align:left">${icon('info', 'sm')}<span>Can’t find it? Check your <b>Spam</b> or <b>Promotions</b> folder. You can request a new code after ${Config.otp.resendSec} seconds.</span></div></div></div></div></div>`);
    const boxes = $$('#otpBoxes input'), msg = $('#otpMsg'), rb = $('#resend');
    boxes[0].focus();
    boxes.forEach((b, i) => {
      b.oninput = () => { b.value = b.value.replace(/\D/g, '').slice(-1); $('#otpBoxes').classList.remove('bad'); if (b.value && boxes[i + 1]) boxes[i + 1].focus(); if (boxes.every(x => x.value)) $('#otpForm').requestSubmit(); };
      b.onkeydown = e => { if (e.key === 'Backspace' && !b.value && boxes[i - 1]) boxes[i - 1].focus(); };
      b.onpaste = e => { const t = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, boxes.length); if (t.length) { e.preventDefault(); t.split('').forEach((c, k) => boxes[k] && (boxes[k].value = c)); if (t.length === boxes.length) $('#otpForm').requestSubmit(); } };
    });
    let timer; const tick = async () => {
      const cur = await Auth.otpStatus(email); if (!cur || !cur.expires) return;
      const left = Math.max(0, cur.expires - Date.now()), cd = Math.max(0, Config.otp.resendSec * 1000 - (Date.now() - (cur.lastSent || 0)));
      const el = $('#otpTtl'); if (!el) return clearInterval(timer);
      el.textContent = Math.floor(left / 60000) + ':' + Util.pad(Math.floor(left / 1000) % 60);
      rb.disabled = cd > 0; rb.textContent = cd > 0 ? `Resend code in ${Math.ceil(cd / 1000)}s` : 'Resend code';
    };
    tick(); timer = setInterval(tick, 1000);
    rb.onclick = async () => { UI.busy(rb, true, 'Sending…'); try { await Auth.resend(email); msg.textContent = ''; } catch (err) { msg.textContent = err.message; } UI.busy(rb, false); boxes.forEach(b => b.value = ''); boxes[0].focus(); tick(); };
    $('#otpForm').onsubmit = async e => {
      e.preventDefault(); const code = boxes.map(b => b.value).join('');
      if (code.length < boxes.length) { msg.textContent = 'Please enter all 6 digits.'; $('#otpBoxes').classList.remove('bad'); void $('#otpBoxes').offsetWidth; $('#otpBoxes').classList.add('bad'); return; }
      const btn = $('#otpForm button'); UI.busy(btn, true, 'Verifying…'); await Util.sleep(400);
      const r = await Auth.verifyOtp(email, code); UI.busy(btn, false);
      if (!r.ok) { msg.textContent = r.msg; const ob = $('#otpBoxes'); ob.classList.remove('bad'); void ob.offsetWidth; ob.classList.add('bad'); setTimeout(() => { boxes.forEach(b => { b.value = ''; }); ob.classList.remove('bad'); boxes[0].focus(); }, 450); return; }
      clearInterval(timer); $('#otpBoxes').classList.add('good');
      Anim.procShow('otp', 'Verifying', 'Activating your account…'); await Util.sleep(700); Anim.procDone('otp', 'Account verified', 'Welcome to PetCare!'); await Util.sleep(1000); Anim.procHide();
      location.hash = next || (Auth.isStaff() ? '#/admin' : '#/account/pets');
    };
  },
  async forgot(ctx) {
    if (Auth.user) { location.hash = Auth.home(); return; }
    const next = ctx.query.next || ''; let email = ctx.query.email || '';
    const step1 = () => {
      setView(`<div class="auth-wrap">${this.side('Forgot your password?', 'We will email you a 6-digit code so you can set a new one.')}<div class="auth-main"><div class="auth-card"><form class="card" id="fpForm" novalidate><h2 style="font-size:24px">Reset password</h2><p class="muted small">Enter the email you used to register.</p>
        ${Form.field({ name: 'email', label: 'Email', type: 'email', required: true, value: email, attrs: 'autocomplete="email"' })}<button class="btn btn-primary btn-block btn-lg" type="submit">${icon('mail', 'sm')} Send reset code</button><p class="small center mt2 mb0"><a href="#/login${Util.qs({ next })}">Back to sign in</a></p></form></div></div></div>`);
      const f = $('#fpForm'); Form.live(f);
      f.onsubmit = async e => { e.preventDefault(); const d = Form.validate(f, { email: [V.req, V.email] }); if (!d) return; const b = $('button[type=submit]', f); UI.busy(b, true, 'Sending…'); try { await Auth.sendReset(d.email); email = d.email.toLowerCase(); step2(); } catch (err) { UI.busy(b, false); Form.error(f, 'email', err.message); } };
    };
    const step2 = () => {
      setView(`<div class="auth-wrap">${this.side('Check your email', 'If an account exists for this email, a reset code is on its way.')}<div class="auth-main"><div class="auth-card"><form class="card" id="rpForm" novalidate><h2 style="font-size:24px">Set a new password</h2><p class="muted small">Code sent to <b>${esc(email)}</b>. Check Spam if you don’t see it.</p>
        ${Form.field({ name: 'code', label: '6-digit code', required: true, attrs: 'inputmode="numeric" autocomplete="one-time-code" maxlength="10"' })}
        <div class="form-grid">${Form.field({ name: 'pw', label: 'New password', type: 'password', required: true, hint: '8+ characters with letters and numbers', attrs: 'autocomplete="new-password"' })}${Form.field({ name: 'pw2', label: 'Confirm new password', type: 'password', required: true, attrs: 'autocomplete="new-password"' })}</div>
        <button class="btn btn-primary btn-block btn-lg" type="submit">${icon('key', 'sm')} Save new password</button>
        <p class="small center mt2 mb0"><a href="#" id="again">Send a new code</a> · <a href="#/login${Util.qs({ next })}">Back to sign in</a></p></form></div></div></div>`);
      const f = $('#rpForm'); Form.live(f);
      $('#again').onclick = e => { e.preventDefault(); step1(); };
      f.onsubmit = async e => {
        e.preventDefault(); const d = Form.validate(f, { code: [V.req, v => /^\d{6,10}$/.test(v) ? null : 'Enter the 6-digit code from the email.'], pw: [V.req, V.pw], pw2: [V.req, (v, a) => v !== a.pw ? 'Passwords do not match.' : null] }); if (!d) return;
        const b = $('button[type=submit]', f); UI.busy(b, true, 'Saving…');
        try { await Auth.resetWithCode(email, d.code, d.pw); UI.toast('Password updated', 'You are now signed in.', 'ok'); location.hash = next || Auth.home(); }
        catch (err) { UI.busy(b, false); Form.error(f, 'code', err.message); }
      };
    };
    step1();
  }
};

  /** Pay window: choose a payment option, see where to send, upload the receipt. */

        <div id="payOnline">${Form.field({ name: 'refNo', label: 'Reference number', required: true, value: p.refNo || '', placeholder: 'e.g. 7001234567' })}<div class="field" data-f="receipt"><span class="lbl">Receipt image <span style="color:var(--red)">*</span></span><div class="photo-drop"><input type="file" accept="image/*" aria-label="Upload receipt">${icon('receipt', 'lg')}<div class="small"><b>Upload a screenshot</b> of your receipt</div></div><div class="photo-prev"></div><span class="err" role="alert"></span></div></div>

          if (!cash) { await EmailService.send(Config.clinic.email, 'Payment for verification', `${Auth.user.name} uploaded a ${d.method} receipt (${d.refNo}) for ${Util.money(p.amount)}.`, { silent: true }); await EmailService.send(Auth.user.email, 'Receipt received', `Hi ${Auth.user.name},\n\nWe received your ${d.method} receipt (ref ${d.refNo}) for ${Util.money(p.amount)}. We will email you once it is verified.` + EmailService.sign()); }

const Charts = {
  bars(data, { money = false, h = 220, color = '#1B4B9B' } = {}) {
    const W = Math.max(320, data.length * 56), pad = 28, max = Math.max(1, ...data.map(d => d.value)), bw = Math.min(38, (W - pad * 2) / data.length * .6), step = (W - pad * 2) / data.length;
    const fmt = v => money ? (v >= 1000 ? '₱' + (v / 1000).toFixed(1) + 'k' : '₱' + v) : v;
    return `<svg class="chart" viewBox="0 0 ${W} ${h}" preserveAspectRatio="xMidYMid meet" style="min-width:${Math.min(W, 640)}px" role="img" aria-label="Bar chart">${[0, .5, 1].map(k => `<line x1="${pad}" x2="${W - pad}" y1="${h - 30 - (h - 60) * k}" y2="${h - 30 - (h - 60) * k}" stroke="#E3E9F3" stroke-dasharray="${k ? '4 5' : ''}"/>`).join('')}
      ${data.map((d, i) => { const bh = (h - 60) * d.value / max, x = pad + step * i + (step - bw) / 2, y = h - 30 - bh; return `<g><rect class="bar" x="${x}" y="${y}" width="${bw}" height="${Math.max(bh, 2)}" rx="7" fill="${d.hi ? '#D93B48' : color}" style="animation-delay:${i * 70}ms"><title>${esc(d.label)}: ${fmt(d.value)}</title></rect><text x="${x + bw / 2}" y="${y - 7}" text-anchor="middle" font-size="11" font-weight="700" fill="#102A56" font-family="DM Sans">${d.value ? fmt(d.value) : ''}</text><text x="${x + bw / 2}" y="${h - 10}" text-anchor="middle" font-size="11" fill="#66748F" font-family="DM Sans">${esc(d.label)}</text></g>`; }).join('')}</svg>`;
  }
};

  async apptAction(act, a, c, after) {

      const m = UI.modal({ title: `${svc} · ${pet.name || ''}`, wide: true, body: `<div class="grid g2" style="align-items:start"><dl class="review-list"><dt>Status</dt><dd>${UI.statusBadge(a.status)}</dd><dt>When</dt><dd>${when}</dd><dt>Pet</dt><dd><a href="#/admin/pets/${a.petId}" data-x>${esc(pet.name || '')}</a> (${esc(pet.species || '')}, ${esc(pet.breed || '')})</dd><dt>Owner</dt><dd><a href="#/admin/clients/${a.ownerId}" data-x>${esc(owner.name || '')}</a><br><span class="small muted">${esc(owner.mobile || '')} · ${esc(owner.email || '')}</span></dd><dt>Price</dt><dd>${Util.money(a.price)}${a.tier ? ' (Tier ' + esc(a.tier) + ')' : ''}</dd><dt>Payment</dt><dd>${pay ? UI.statusBadge(pay.status) + ' ' + esc(pay.method || '') : '—'}</dd><dt>Address</dt><dd>${esc(a.municipality)} · ${esc(a.address)}<br>${gmapsLink(a.lat, a.lng, 'Open in Google Maps', 'small')}</dd>${a.notes ? `<dt>Notes</dt><dd>${esc(a.notes)}</dd>` : ''}${a.cancelReason ? `<dt>Cancel reason</dt><dd>${esc(a.cancelReason)}</dd>` : ''}</dl><div><div class="mapbox sm" id="apMap"></div><h4 class="mt2">History</h4>${(a.history || []).map(h => `<div class="small" style="padding:6px 0;border-bottom:1px dashed var(--line)"><b>${esc(h.text)}</b><div class="tiny muted">${Util.fmtDT(h.at)} · ${esc(h.by)}</div></div>`).join('')}</div></div>`, onOpen: mm => setTimeout(() => MapKit.show(mm.$('#apMap'), [{ lat: a.lat, lng: a.lng, label: esc(owner.name || '') }]), 150) });

      if (!v.ok) { UI.toast('Requested slot is no longer valid', v.errors[0] + ' Use Reschedule to pick another.', 'err'); return; }

            ${pay && pay.receipt ? `<button type="button" class="rcpt-thumb mt2" data-rcpt title="Open full size"><img src="${safeSrc(pay.receipt)}" alt="Payment receipt"></button><p class="tiny muted mt1 mb0">Check the amount (${Util.money(a.price)}), reference number and recipient before confirming.</p>`

  /* ---------- Medical records ---------- */
  recordForm(pet, after, appt) {
    const types = ['Checkup', 'Vaccination visit', 'Deworming', 'Grooming', 'Follow-up', 'Treatment', 'Surgery', 'Laboratory'];
    const def = appt ? ({ checkup: 'Checkup', deworming: 'Deworming', grooming: 'Grooming', followup: 'Follow-up' }[appt.serviceKey] || 'Checkup') : 'Checkup';

    m.$('#recSave').onclick = async () => {
      const d = Form.validate(f, { date: [V.req], diagnosis: [V.req, V.max(300)], treatment: [V.req, V.max(500)], notes: [V.max(1500)], nextDue: [(v, a) => v && v <= a.date ? 'Next due must be after the visit date.' : null] }); if (!d) return; m.close();
      await Anim.run('save', { title: 'Saving record', sub: 'Updating medical history…', doneTitle: 'Record saved', doneSub: d.nextDue ? 'Reminder created.' : '', min: 600, hold: 800 }, async () => {
        await DB.add('medicalRecords', { petId: pet.id, ownerId: pet.ownerId, ...d, vetId: Auth.user.id, vetName: Auth.user.name, appointmentId: appt ? appt.id : null });
        if (d.nextDue) { await Reminders.createFromDue(pet.id, pet.ownerId, d.type === 'Deworming' ? 'deworming' : 'followup', d.type === 'Deworming' ? 'Next deworming' : 'Follow-up visit', d.nextDue); await Reminders.process(); }

  vaxForm(pet, after) {
    const sugg = pet.species === 'Cat' ? ['4-in-1 Feline (FVRCP+FeLV)', '3-in-1 Feline (FVRCP)', 'Anti-rabies'] : ['5-in-1 (DHPPiL)', '6-in-1 (DHPPiL+Corona)', '8-in-1', 'Kennel cough (Bordetella)', 'Anti-rabies'];
    const m = UI.modal({ title: 'Add vaccination · ' + pet.name, body: `<form id="vxForm" novalidate>${Form.field({ name: 'vaccine', label: 'Vaccine', required: true, attrs: 'list="vxList"' })}<datalist id="vxList">${sugg.map(s => `<option value="${esc(s)}">`).join('')}</datalist><div class="form-grid">${Form.field({ name: 'batch', label: 'Batch / lot no.', required: true })}${Form.field({ name: 'dateGiven', label: 'Date given', type: 'date', required: true, value: Util.today() })}</div>${Form.field({ name: 'nextDue', label: 'Next due date', type: 'date', hint: 'Creates an email reminder for the owner.' })}</form>`, foot: `<button class="btn btn-ghost" data-x>Cancel</button><button class="btn btn-primary" id="vxSave">${icon('syringe', 'sm')} Save vaccination</button>` });

      const d = Form.validate(f, { vaccine: [V.req, V.max(80)], batch: [V.req, V.max(40)], dateGiven: [V.req, v => v > Util.today() ? 'Date given cannot be in the future.' : null], nextDue: [(v, a) => v && v <= a.dateGiven ? 'Next due must be after the date given.' : null] }); if (!d) return; m.close();
      await Anim.run('save', { title: 'Saving vaccination', sub: 'Updating the vaccine card…', doneTitle: 'Vaccine recorded', doneSub: d.nextDue ? 'Reminder created for ' + Util.fmtDate(d.nextDue) + '.' : '', min: 600, hold: 900 }, async () => {
        await DB.add('vaccinations', { petId: pet.id, ownerId: pet.ownerId, ...d, vetId: Auth.user.id, vetName: Auth.user.name });
        if (d.nextDue) { await Reminders.createFromDue(pet.id, pet.ownerId, 'vaccine', d.vaccine + ' booster', d.nextDue); await Reminders.process(); }

      <div class="row mt2"><a class="btn btn-red btn-sm" href="tel:${esc(e.contact)}">${icon('phone', 'sm')} Call owner</a>${e.status === 'New' ? `<button class="btn btn-primary btn-sm" data-ack="${e.id}">Acknowledge</button>` : ''}${e.status !== 'Resolved' ? `<button class="btn btn-soft btn-sm" data-res="${e.id}">${icon('check', 'sm')} Resolve</button>` : ''}<button class="btn btn-ghost btn-sm" data-focus="${e.id}">${icon('pin', 'sm')} Show on map</button>${gmapsLink(e.lat, e.lng, 'Google Maps')}<button class="btn btn-ghost btn-sm" data-eslip="${e.id}">${icon('print', 'sm')} Case slip (PDF)</button>${Auth.isStaff() ? `<button class="btn btn-soft-red btn-sm" data-edel="${e.id}">${icon('trash', 'sm')} Delete</button>` : ''}</div></article>`).join('') : `<div class="card">${UI.empty('No emergency requests', 'All quiet for now.', '', 'paw')}</div>`}</div>
      <div class="card pad-sm" style="position:sticky;top:calc(var(--hdr) + 16px)"><h4 class="mb2">Open cases map</h4><div class="mapbox" id="emMap" style="height:420px"></div><p class="tiny muted mt1 mb0">Navy pin = clinic · red = critical · blue = other open cases.</p></div></div>`);
    const map = await MapKit.show($('#emMap'), open.map(e => ({ lat: e.lat, lng: e.lng, label: `<b>${esc(e.type)}</b><br>${esc(c.p(e.petId).name || '')} · ${esc(e.contact)}`, color: e.critical ? '#D93B48' : '#1B4B9B' })));
    $$('[data-focus]').forEach(b => b.onclick = () => { const e = list.find(x => x.id === b.dataset.focus); if (map && e.lat) { map.setView([e.lat, e.lng], 16); $('#emMap').scrollIntoView({ behavior: 'smooth', block: 'center' }); } });
    $$('[data-edel]').forEach(b => b.onclick = () => { const e = list.find(x => x.id === b.dataset.edel); this.delRec('emergencies', e.id, 'Delete emergency record?', `${e.type} · ${c.p(e.petId).name || 'pet'}. This cannot be undone.`, e.id, () => this.emergencies()); });
    $$('[data-eslip]').forEach(b => b.onclick = async () => {

      try {

          note: `Call the owner at ${e.contact} first. If the pet is unstable, advise them to come straight to the clinic or call ${Config.clinic.hotline}.`, file: `PetCare_Emergency_Slip_${e.id.slice(-6).toUpperCase()}.pdf`

  /* ---------- Pick-ups ---------- */
  async pickups() {

    if (Auth.user.rider && Auth.user.role !== 'admin') list = list.filter(p => !p.riderId || p.riderId === Auth.user.id);
    const active = list.filter(p => p.step < 5 && !p.cancelled);
    await setApp('#/admin/pickups', mainHd('Pick-up management', 'Assign a rider and update each trip step by step. The owner is emailed at every step.') + `
      <div class="card pad-sm mb2"><div class="row between mb2"><h4 class="mb0">Pick-up locations · active trips</h4><span class="tiny muted">Trip status is updated by staff at each step</span></div><div class="mapbox" id="pkMap"></div></div>
      <div class="stack">${list.length ? list.map(p => `<article class="card" data-reveal><div class="row between"><div><b style="color:var(--navy);font-family:var(--f-head)">${esc(c.p(p.petId).name || 'Pet')} · ${Util.fmtDate(p.date)} ${Util.fmtTime(p.time)}</b><div class="small muted">${esc(c.u(p.ownerId).name || '')} · ${esc(c.u(p.ownerId).mobile || '')} · ${esc(p.municipality)}, ${esc(p.address)}</div>${p.notes ? `<div class="small">Note: ${esc(p.notes)}</div>` : ''}<div class="row mt1" style="gap:6px">${gmapsLink(p.lat, p.lng, 'Open in Google Maps')}<button class="btn btn-ghost btn-sm" data-slip="${p.id}">${icon('print', 'sm')} Rider slip (PDF)</button>${Auth.isStaff() ? `<button class="btn btn-soft-red btn-sm" data-pdel="${p.id}">${icon('trash', 'sm')} Delete</button>` : ''}</div></div>${p.cancelled ? '<span class="badge b-gray">Cancelled</span>' : UI.statusBadge(Owner.steps[p.step])}</div>
        ${p.cancelled ? '' : Owner.timeline(p.step)}

    $$('[data-pdel]').forEach(b => b.onclick = () => { const p = list.find(x => x.id === b.dataset.pdel); this.delRec('pickups', p.id, 'Delete pick-up?', `${c.p(p.petId).name || 'Pet'} · ${Util.fmtDate(p.date)}. This cannot be undone.`, p.id, () => this.pickups()); });

      try {
        await Anim.run('download', { title: 'Preparing rider slip', sub: 'Drawing the map and QR code…', doneTitle: 'Slip ready', doneSub: 'Saved as a PDF.', min: 900, hold: 800 }, () => Slip.pdf({
          kicker: 'Rider pick-up slip', title: `${pet.name || 'Pet'} · ${Util.fmtDate(p.date)} ${Util.fmtTime(p.time)}`, ref: p.id.slice(-6).toUpperCase(), lat: p.lat, lng: p.lng, accent: [27, 75, 155],

          note: 'Call the owner before arriving. Use a carrier for cats and a leash for dogs. Update the trip status in PetCare at every step so the owner gets an email.',
          signatures: ['Released by owner', 'Picked up by rider', 'Received at clinic'], file: `PetCare_Pickup_Slip_${(pet.name || 'pet').replace(/\W+/g, '_')}_${p.date}.pdf`
        }));

    $$('[data-pcx]').forEach(b => b.onclick = async () => { const p = list.find(x => x.id === b.dataset.pcx); const r = await UI.prompt({ title: 'Cancel pick-up', label: 'Reason (sent to the owner)', ok: 'Cancel trip', danger: true }); if (!r) return; await DB.update('pickups', p.id, { cancelled: true, cancelReason: r }); await notifyOwner(p.ownerId, 'Pick-up cancelled', `Your pick-up request for ${c.p(p.petId).name} was cancelled.\nReason: ${r}`); await Log.add('Cancelled pick-up', p.id); this.pickups(); });

  /* ---------- Payments ---------- */
  async payments(ctx) {

  /* ---------- Reports ---------- */
  async reports(ctx) {
    const from = ctx.query.from || Util.addDays(Util.today(), -29), to = ctx.query.to || Util.addDays(Util.today(), 14);
    const c = await this.ctx(); const [appts, pays, res] = await Promise.all([DB.getAll('appointments'), DB.getAll('payments'), DB.getAll('reservations')]);
    const A = appts.filter(a => a.date >= from && a.date <= to); const inR = ts => { if (!ts) return false; const d = Util.iso(new Date(ts)); return d >= from && d <= to; };
    const P = pays.filter(p => { const a = appts.find(x => x.id === p.appointmentId); return a && a.date >= from && a.date <= to; });
    const revenue = pays.filter(p => p.status === 'Verified' && inR(p.verifiedAt)).reduce((s, p) => s + p.amount, 0) + res.filter(r => r.status === 'Completed' && inR(r.completedAt)).reduce((s, r) => s + r.total, 0);
    const byDate = {}; A.forEach(a => byDate[a.date] = (byDate[a.date] || 0) + 1);
    const days = []; for (let d = from; d <= to && days.length < 62; d = Util.addDays(d, 1)) days.push(d);
    const bars = days.map(d => ({ label: Util.parse(d).getDate() + '', value: byDate[d] || 0, hi: d === Util.today() }));
    const svcRows = c.svcs.map(s => { const l = A.filter(a => a.serviceKey === s.key); return { name: s.name, total: l.length, done: l.filter(a => a.status === 'Completed').length, cancelled: l.filter(a => a.status === 'Cancelled').length, value: l.filter(a => a.status !== 'Cancelled').reduce((t, a) => t + a.price, 0) }; });
    const payRows = ['Unpaid', 'For verification', 'Verified', 'Rejected'].map(s => ({ s, n: P.filter(p => p.status === s).length, amt: P.filter(p => p.status === s).reduce((t, p) => t + p.amount, 0) }));
    const top = {}; res.filter(r => r.status !== 'Cancelled' && inR(r.createdAt)).forEach(r => r.items.forEach(i => { top[i.name] = top[i.name] || { qty: 0, amt: 0 }; top[i.name].qty += i.qty; top[i.name].amt += i.qty * i.price; }));
    const topRows = Object.entries(top).sort((a, b) => b[1].qty - a[1].qty).slice(0, 10);
    await setApp('#/admin/reports', mainHd('Reports', `${Util.fmtDate(from)} to ${Util.fmtDate(to)}`, `<button class="btn btn-ghost" id="csv">${icon('download', 'sm')} Export CSV</button><button class="btn btn-ghost" onclick="window.print()">${icon('print', 'sm')} Print</button>`) + `
      <form class="card pad-sm mb2 no-print" id="rf"><div class="toolbar mb0"><label class="lbl" for="rfrom">From</label><input class="input" type="date" id="rfrom" value="${from}" style="width:auto"><label class="lbl" for="rto">To</label><input class="input" type="date" id="rto" value="${to}" style="width:auto"><button class="btn btn-primary btn-sm" type="submit">Apply</button>${[['7', 'Last 7 days'], ['30', 'Last 30 days'], ['90', 'Last 90 days']].map(([n, l]) => `<button type="button" class="btn btn-ghost btn-sm" data-rng="${n}">${l}</button>`).join('')}</div></form>
      <div class="stats" data-stagger>${[['calendar', 'Bookings', A.length, ''], ['check', 'Completed', A.filter(a => a.status === 'Completed').length, 'green'], ['x', 'Cancelled', A.filter(a => a.status === 'Cancelled').length, 'red'], ['card', 'Revenue (verified)', revenue, 'green', 1]].map(([i, l, n, cl, m]) => `<div class="stat ${cl}" data-reveal><span class="si">${icon(i)}</span><div><b data-count="${n}" ${m ? 'data-money="1"' : ''}>0</b><span>${l}</span></div></div>`).join('')}</div>
      <div class="card mt3" data-reveal><h3>Bookings by date</h3><div style="overflow-x:auto">${Charts.bars(bars, { h: 200 })}</div></div>
      <div class="grid g2 mt3" style="align-items:start"><div class="card" data-reveal><h3>Services breakdown</h3><div class="tbl-scroll"><table class="tbl"><thead><tr><th>Service</th><th>Booked</th><th>Done</th><th>Cancelled</th><th class="right">Value</th></tr></thead><tbody>${svcRows.map(r => `<tr><td>${esc(r.name)}</td><td>${r.total}</td><td>${r.done}</td><td>${r.cancelled}</td><td class="right">${Util.money(r.value)}</td></tr>`).join('')}</tbody></table></div></div>
      <div class="card" data-reveal><h3>Payment status</h3><div class="tbl-scroll"><table class="tbl"><thead><tr><th>Status</th><th>Count</th><th class="right">Amount</th></tr></thead><tbody>${payRows.map(r => `<tr><td>${UI.statusBadge(r.s)}</td><td>${r.n}</td><td class="right">${Util.money(r.amt)}</td></tr>`).join('')}</tbody></table></div></div></div>
      <div class="card mt3" data-reveal><h3>Top reserved products</h3>${topRows.length ? `<div class="tbl-scroll"><table class="tbl"><thead><tr><th>#</th><th>Product</th><th>Qty</th><th class="right">Value</th></tr></thead><tbody>${topRows.map(([n, v], i) => `<tr><td>${i + 1}</td><td>${esc(n)}</td><td>${v.qty}</td><td class="right">${Util.money(v.amt)}</td></tr>`).join('')}</tbody></table></div>` : UI.empty('No reservations in this range')}</div>`);
    $('#rf').onsubmit = e => { e.preventDefault(); const f = $('#rfrom').value, t = $('#rto').value; if (!f || !t || f > t) return UI.toast('Check the dates', 'The start date must be before the end date.', 'err'); location.hash = '#/admin/reports' + Util.qs({ from: f, to: t }); };
    $$('[data-rng]').forEach(b => b.onclick = () => location.hash = '#/admin/reports' + Util.qs({ from: Util.addDays(Util.today(), -(+b.dataset.rng - 1)), to: Util.today() }));
    $('#csv').onclick = () => {
      const rows = [['PetCare report', from + ' to ' + to], [], ['Appointments'], ['Date', 'Time', 'Pet', 'Species', 'Owner', 'Municipality', 'Service', 'Tier', 'Price', 'Status', 'Payment']];
      A.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time)).forEach(a => rows.push([a.date, a.time, c.p(a.petId).name, c.p(a.petId).species, c.u(a.ownerId).name, a.municipality, svcName(c.svcs, a.serviceKey), a.tier || '', a.price, a.status, (pays.find(p => p.appointmentId === a.id) || {}).status || '']));
      rows.push([], ['Services breakdown'], ['Service', 'Booked', 'Completed', 'Cancelled', 'Value']); svcRows.forEach(r => rows.push([r.name, r.total, r.done, r.cancelled, r.value]));
      rows.push([], ['Payment status'], ['Status', 'Count', 'Amount']); payRows.forEach(r => rows.push([r.s, r.n, r.amt]));
      rows.push([], ['Top reserved products'], ['Product', 'Qty', 'Value']); topRows.forEach(([n, v]) => rows.push([n, v.qty, v.amt]));
      rows.push([], ['Revenue (verified)', revenue]);
      Util.download(`PetCare_report_${from}_to_${to}.csv`, '﻿' + Util.csv(rows), 'text/csv'); Log.add('Exported report CSV', from + ' to ' + to); UI.toast('CSV exported', '', 'ok');
    };
  },

      .map(([n, t, d, h, l]) => `<div class="card" data-reveal><span class="date-chip" style="display:inline-block;width:auto;padding:4px 12px;margin-bottom:10px"><b style="font-size:15px">Step ${n}</b></span><h4>${t}</h4><p class="small muted mb0">${d}</p>${h ? `<a class="btn btn-soft btn-sm mt2" href="${h}" target="_blank" rel="noopener">${icon('nav', 'sm')} ${l}</a>` : ''}</div>`).join('');
  },
  async view() {
    if (Backend.fixed) {
      setView(`<section class="sec"><div class="container" style="max-width:720px"><div class="card center"><h2>Connected to the clinic database</h2><p class="muted">This website was set up to connect automatically (Config.supabase in index.html).</p><a class="btn btn-primary" href="#/">${icon('home', 'sm')} Go to the website</a></div></div></section>`); return;
    }
    const cur = Backend.mode === 'supabase' ? { url: Backend.url, key: Backend.key } : {};
    setView(`<section class="sec"><div class="container" style="max-width:1040px">
      <div class="center mb2"><span class="kicker">First-time setup</span><h1>Connect PetCare to its database</h1><p class="muted" style="max-width:640px;margin:0 auto">Like running <b>setup()</b> in Apps Script: do this once, and every page saves to Supabase automatically.</p></div>
      <div class="grid g3 mt3" data-stagger>${this.steps()}</div>
      <div class="grid g2 mt3" style="align-items:start">
        <form class="card" id="cnForm" novalidate data-reveal><h3>${icon('database')} Connect Supabase</h3>
          ${Form.field({ name: 'url', label: 'Project URL', required: true, value: cur.url || '', placeholder: 'https://abcd1234.supabase.co', attrs: 'autocomplete="off" spellcheck="false"' })}
          ${Form.field({ name: 'key', label: 'Publishable (anon) key', required: true, value: cur.key || '', placeholder: 'sb_publishable_… or eyJ…', hint: 'Never paste the secret / service_role key here.', attrs: 'autocomplete="off" spellcheck="false"' })}
          <button class="btn btn-primary btn-block btn-lg" type="submit">${icon('database', 'sm')} Connect</button><div id="cnResult" class="mt2"></div></form>
      </div></div></section>`);
    const f = $('#cnForm'); Form.live(f);
    const check = async () => {
      const d = Form.validate(f, { url: [V.req], key: [V.req] }); if (!d) return;
      const btn = $('button[type=submit]', f); UI.busy(btn, true, 'Checking…'); const r = await Backend.test(d.url, d.key); UI.busy(btn, false);
      const out = $('#cnResult');
      if (!r.ok) { if (r.field) Form.error(f, r.field, r.msg); else out.innerHTML = `<div class="notice red small">${icon('alert', 'sm')}<span>${esc(r.msg)}</span></div>`; return; }
      const url = d.url.trim().replace(/\/+$/, '');
      if (!r.setup) {
        out.innerHTML = `<div class="notice amber">${icon('info', 'sm')}<div><b>Connected — one step left.</b> The database is still empty. Open the SQL Editor, paste <b>setup.sql</b> from the PetCare folder, click <b>Run</b>, then check again.<div class="row mt2"><a class="btn btn-primary btn-sm" href="${esc(Backend.dashboardUrl.call({ projectRef: () => Backend.projectRef(url) }, '/sql/new'))}" target="_blank" rel="noopener">${icon('nav', 'sm')} Open SQL Editor</a><button class="btn btn-ghost btn-sm" type="button" id="cnAgain">${icon('refresh', 'sm')} I ran it — check again</button></div></div></div>`;
        $('#cnAgain').onclick = check; return;
      }
      Backend.save({ mode: 'supabase', url, key: d.key.trim() });
      try { localStorage.setItem('petcare:justConnected', '1'); } catch (e) { /* ignore */ }
      Anim.procShow('save', 'Connecting', 'Opening your database…'); await Util.sleep(600); Anim.procDone('save', 'Database connected', 'Create the clinic admin account next.'); await Util.sleep(1100);
      location.hash = '#/register'; location.reload();
    };
    f.onsubmit = e => { e.preventDefault(); check(); };
  },
  setupGate() {
    gateView('Database setup needed', 'PetCare is connected to Supabase, but setup.sql has not been run yet (or did not finish). Open the SQL Editor, paste the whole setup.sql file from the PetCare folder, click Run, then try again.',
      `<a class="btn btn-white" href="${esc(Backend.dashboardUrl('/sql/new'))}" target="_blank" rel="noopener">${icon('nav', 'sm')} Open SQL Editor</a><button class="btn btn-outline-white" onclick="location.reload()">${icon('refresh', 'sm')} Check again</button>${Backend.fixed ? '' : `<a class="btn btn-outline-white" href="#/connect">Change connection</a>`}`);
  },
  offlineGate() {
    gateView('Can’t reach the clinic database', 'Please check your internet connection and try again. If this keeps happening, the Supabase project may be paused (free projects pause after a week without visits) — open the Supabase dashboard and click Restore.',
      `<button class="btn btn-white" onclick="location.reload()">${icon('refresh', 'sm')} Try again</button>${Backend.fixed ? '' : `<a class="btn btn-outline-white" href="#/connect">Change connection</a>`}`);
  },
  async databaseTab(B) {
    let q = 0, fl = 0, sent = 0; try { const m = await DB.getAll('emailOutbox'); q = m.filter(x => x.status === 'queued').length; fl = m.filter(x => x.status === 'failed').length; sent = m.filter(x => x.status === 'sent').length; } catch (e) { /* ignore */ }
    const snippet = `supabase: { url: '${Backend.url}', key: '${Backend.key}' },`;
    B.innerHTML = `<div class="grid g2" style="align-items:start"><div class="card"><h3>${icon('database')} Supabase · connected</h3><dl class="kv"><dt>Project</dt><dd>${esc(Backend.url)}</dd><dt>Setup</dt><dd>schema v${esc(Backend.version)} <span class="badge b-green">Ready</span></dd><dt>Connected by</dt><dd>${Backend.fixed ? 'Config.supabase in index.html (all visitors)' : 'This browser only (Connect screen)'}</dd></dl>
        <div class="row mt2"><a class="btn btn-ghost btn-sm" href="${esc(Backend.dashboardUrl())}" target="_blank" rel="noopener">${icon('nav', 'sm')} Open dashboard</a><a class="btn btn-ghost btn-sm" href="${esc(Backend.dashboardUrl('/sql/new'))}" target="_blank" rel="noopener">${icon('file', 'sm')} SQL Editor</a>${Backend.fixed ? '' : `<button class="btn btn-soft-red btn-sm" id="dbChange">${icon('refresh', 'sm')} Change connection</button>`}</div></div>
      <div class="card"><h3>${icon('mail')} Email delivery</h3><p class="small muted">Queued <b>${q}</b> · Failed <b>${fl}</b> · Sent <b>${sent}</b></p><button class="btn btn-primary btn-sm" id="dbFlush">${icon('mail', 'sm')} Send queued emails now</button>${Auth.isAdmin() ? ` <button class="btn btn-soft-red btn-sm" id="dbPurge">${icon('trash', 'sm')} Delete sent and failed emails older than 30 days</button>` : ''}<p class="small muted mt2 mb0">Login codes use Supabase Auth SMTP. Notifications use the <b>send-email</b> Edge Function. See SETUP_GUIDE.md.</p></div></div>
      ${Backend.fixed ? '' : `<div class="card mt3"><h3>${icon('key')} Connect every visitor automatically</h3><p class="small muted">Before uploading index.html, replace the <code>supabase: { url: '', key: '' },</code> line in the Config section with this line:</p><pre class="email-item" style="white-space:pre-wrap;word-break:break-all;margin:0">${esc(snippet)}</pre><button class="btn btn-soft btn-sm mt2" id="dbCopy">${icon('file', 'sm')} Copy line</button></div>`}`;
    if ($('#dbPurge')) $('#dbPurge').onclick = async () => { if (!await UI.confirm({ title: 'Delete old email records?', msg: 'Sent and failed emails older than 30 days are deleted from the queue. Queued emails are kept.', ok: 'Delete', danger: true })) return; try { const n = await DB.purgeOld('emailOutbox', 30, ['sent', 'failed']); UI.toast('Email queue cleaned', n + ' record' + (n === 1 ? '' : 's') + ' deleted', 'ok'); this.settings(ctx); } catch (e) { UI.toast('Could not delete', e.message, 'err'); } };
    $('#dbFlush').onclick = async e => { UI.busy(e.currentTarget, true, 'Sending…'); const ok = await EmailService.flush(); UI.busy(e.currentTarget, false); UI.toast(ok ? 'Queued emails sent' : 'Nothing was sent', ok ? '' : 'No queued emails, or the send-email function is not set up yet.', ok ? 'ok' : 'info'); };
    if ($('#dbCopy')) $('#dbCopy').onclick = async () => { try { await navigator.clipboard.writeText(snippet); UI.toast('Copied', 'Paste it into index.html', 'ok'); } catch (e) { UI.toast('Copy not allowed', 'Select the line and copy it manually.', 'err'); } };
    if ($('#dbChange')) $('#dbChange').onclick = async () => { if (!await UI.confirm({ title: 'Change database connection?', msg: 'You will be signed out. Data already in Supabase stays there.', ok: 'Continue' })) return; await Auth.logout(); Backend.save(null); location.hash = '#/connect'; location.reload(); };
  }
};

/* =====================================================================
   ROUTER — hash based; protected routes redirect to login and return
   ===================================================================== */
/* Multi-page version: each HTML file serves one area (index = public site, login = sign-in and
   registration, user = pet-owner portal, admin = clinic staff). A link to another area opens that
   file with the same #route. The single-file version does not set PETCARE_PAGE, so it stays on one page. */
const Pages = {
  current: window.PETCARE_PAGE || '',
  file: { index: 'index.html', login: 'login.html', user: 'user.html', admin: 'admin.html' },
  of(path) {
    if (/^\/(login|register|verify|forgot|connect)$/.test(path)) return 'login';
    if (/^\/admin(\/|$)/.test(path)) return 'admin';
    if (/^\/(account|book|emergency|pickup|reserve)(\/|$)/.test(path)) return 'user';
    return 'index';
  },
  redirect(r) { if (!this.current) return false; const want = this.of(r.path); if (want === this.current) return false; location.replace(this.file[want] + '#' + r.raw); return true; }
};
const Router = {
  routes: [], current: { path: '/', query: {} },
  on(pattern, handler, opts = {}) { const keys = []; const rx = new RegExp('^' + pattern.replace(/:(\w+)/g, (_, k) => { keys.push(k); return '([^/]+)'; }) + '/?$'); this.routes.push({ rx, keys, handler, opts }); return this; },
  parse() { const raw = location.hash.slice(1) || '/'; const [p, qs] = raw.split('?'); return { raw, path: p || '/', query: Object.fromEntries(new URLSearchParams(qs || '')) }; },
  async resolve() {
    const r = this.parse(); if (Pages.redirect(r)) return; this.current = r; Anim.routeStart(); UI.closeDrawers(); $$('.modal-wrap').forEach(m => m.remove()); document.body.style.overflow = '';
    let match = null, params = {};
    for (const rt of this.routes) { const m = r.path.match(rt.rx); if (m) { match = rt; rt.keys.forEach((k, i) => params[k] = decodeURIComponent(m[i + 1])); break; } }
    const o = match ? match.opts : {};
    if (r.path !== '/connect') {
      if (Backend.mode === null) { location.replace('#/connect'); return; }
      if (Backend.mode === 'supabase' && (Backend.offline || !Backend.setupOk)) { Shell.render(r.path); Shell.footer(false); Backend.offline ? ConnectViews.offlineGate() : ConnectViews.setupGate(); Anim.routeEnd(); return; }
    }
    if (o.auth && !Auth.user) { location.replace('#/login' + Util.qs({ next: '#' + r.raw })); return; }
    Shell.render(r.path); Shell.footer(!o.auth && !o.bare);
    if (o.auth && o.roles && !o.roles.includes(Auth.user.role)) {
      const isStaff = Auth.isStaff(), ownerPage = o.roles.includes('owner'), adminPage = !ownerPage && !o.roles.includes('staff');
      const [gt, gm] = ownerPage ? ['This area is for pet owners', 'You are signed in with a clinic account. Pet-owner pages like booking and My Pets need an owner account.']
        : adminPage && isStaff ? ['Administrators only', 'Only the clinic administrator can open this page. Ask the administrator if you need a setting changed.']
        : ['Staff only', 'This page is only for clinic staff. If you think this is a mistake, contact the clinic administrator.'];
      gateView(gt, gm, `<a class="btn btn-white" href="${Auth.home()}">${icon('grid', 'sm')} Go to ${isStaff ? 'dashboard' : 'my account'}</a><a class="btn btn-outline-white" href="#/">Public site</a>`);
      Anim.routeEnd(); return;
    }
    try { window.scrollTo(0, 0); await (match ? match.handler({ params, query: r.query, path: r.path }) : PublicViews.notFound()); ClinicMap.mountAll(); }
    catch (e) { console.error(e); gateView('Something went wrong', 'We could not open this page. Please check your internet connection and try again.', `<button class="btn btn-white" onclick="Router.resolve()">${icon('refresh', 'sm')} Try again</button><a class="btn btn-outline-white" href="#/">Home</a>`); }
    Anim.routeEnd(); const v = $('#view'); if (document.activeElement === document.body || !v.contains(document.activeElement)) v.focus({ preventScroll: true });
    const titles = { '/': 'Home', '/store': 'Store', '/services': 'Services', '/book': 'Book', '/admin': 'Dashboard' }; document.title = `${titles[r.path] ? titles[r.path] + ' · ' : ''}${Config.clinic.brand} | ${Config.clinic.name}`;
  }
};
const OWN = { auth: true, roles: ['owner'] }, STAFF = { auth: true, roles: ['staff', 'admin'] }, ADMIN = { auth: true, roles: ['admin'] }, ANY = { auth: true };
Router
  .on('/', () => PublicViews.home()).on('/services', () => PublicViews.services()).on('/store', c => PublicViews.store(c)).on('/store/product/:id', c => PublicViews.product(c))
  .on('/about', () => PublicViews.about()).on('/contact', () => PublicViews.contact()).on('/faq', () => PublicViews.faq()).on('/privacy', () => PublicViews.privacy()).on('/terms', () => PublicViews.terms())
  .on('/login', c => AuthViews.login(c), { bare: true }).on('/register', c => AuthViews.register(c), { bare: true }).on('/verify', c => AuthViews.verify(c), { bare: true }).on('/forgot', c => AuthViews.forgot(c), { bare: true }).on('/connect', () => ConnectViews.view(), { bare: true })
  .on('/account', () => Owner.dashboard(), OWN).on('/account/pets', () => Owner.pets(), OWN).on('/account/pets/:id', c => Owner.petDetail(c), OWN).on('/account/records', () => Owner.records(), OWN)
  .on('/account/appointments', c => Owner.appointments(c), OWN).on('/account/payments', c => Owner.payments(c), OWN).on('/account/reservations', () => Owner.reservations(), OWN).on('/account/profile', () => Owner.profile(), ANY)
  .on('/book', c => Owner.book(c), OWN).on('/emergency', () => Owner.emergency(), OWN).on('/pickup', c => Owner.pickup(c), OWN).on('/reserve', () => Owner.reserve(), OWN)
  .on('/admin', () => AdminViews.dashboard(), STAFF).on('/admin/appointments', c => AdminViews.appointments(c), STAFF).on('/admin/clients', c => AdminViews.clients(c), STAFF).on('/admin/clients/:id', c => AdminViews.client(c), STAFF)
  .on('/admin/pets/:id', c => Owner.petDetail(c, true), STAFF).on('/admin/records', () => AdminViews.records(), STAFF).on('/admin/emergencies', () => AdminViews.emergencies(), STAFF).on('/admin/pickups', () => AdminViews.pickups(), STAFF)
  .on('/admin/payments', c => AdminViews.payments(c), STAFF).on('/admin/store', c => AdminViews.store(c), STAFF).on('/admin/reservations', c => AdminViews.reservations(c), STAFF).on('/admin/messages', () => AdminViews.messages(), STAFF)
  .on('/admin/reports', c => AdminViews.reports(c), STAFF).on('/admin/settings', c => AdminViews.settings(c), ADMIN);

/* =====================================================================
   START-UP — real, staged boot progress (#1)
   ===================================================================== */
const DEFAULTS = JSON.parse(JSON.stringify({ clinic: Config.clinic, app: Config.app, about: Config.about, paymentMethods: Config.paymentMethods }));
window.addEventListener('scroll', () => $('#hdr').classList.toggle('scrolled', window.scrollY > 8), { passive: true });
$('#scrim').addEventListener('click', () => UI.closeDrawers());
document.addEventListener('click', e => { const m = $('#acctMenu'); if (m && !e.target.closest('#acctMenu')) { m.classList.remove('open'); const b = $('#acctBtn'); b && b.setAttribute('aria-expanded', 'false'); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#scrim').classList.contains('open')) UI.closeDrawers(); });
/* Show/hide password: every password box gets an eye button (pages and modals) */
const PwEye = {
  add(root = document) { root.querySelectorAll('input[type=password]:not([data-eye])').forEach(inp => {
    inp.dataset.eye = '1'; const w = document.createElement('span'); w.className = 'pw-wrap'; inp.parentNode.insertBefore(w, inp); w.appendChild(inp);
    const b = document.createElement('button'); b.type = 'button'; b.className = 'pw-eye'; b.setAttribute('aria-label', 'Show password'); b.innerHTML = icon('eye', 'sm');
    b.onclick = () => { const show = inp.type === 'password'; inp.type = show ? 'text' : 'password'; b.innerHTML = icon(show ? 'eyeOff' : 'eye', 'sm'); b.setAttribute('aria-label', show ? 'Hide password' : 'Show password'); inp.focus(); };
    w.appendChild(b); }); }
};
/* "Privacy Notice" links inside forms open a pop-up, so the form (and what was typed) stays */
document.addEventListener('click', e => { const a = e.target.closest('[data-privacy]'); if (!a) return; e.preventDefault(); e.stopPropagation();
  const m = UI.modal({ title: 'Privacy Notice', wide: true, body: `<div class="prose privacy-modal">${PublicViews.privacyBody()}</div>`, foot: `<button class="btn btn-primary" data-x>I understand</button>` });
  const cb = a.closest('label')?.querySelector('input[type=checkbox]'), ok = m.$('.modal-ft [data-x]'); if (cb && ok) ok.onclick = () => { cb.checked = true; cb.dispatchEvent(new Event('change', { bubbles: true })); m.close(); };
}, true);
new MutationObserver(() => PwEye.add()).observe(document.body, { childList: true, subtree: true });
(async function init() {
  if (Pages.redirect(Router.parse())) return; // multi-page version: this #route belongs to another page
  $('#bootLogo').innerHTML = Art.logo(72);
  try {
    Anim.boot.stage(0); Anim.boot.set(10, 'Opening database…'); await LocalDB.open(); // this device's cart and drafts
    try { await Backend.init(); } catch (e) { console.warn('Database not reachable:', e.message); Backend.offline = true; }
    const ready = Backend.mode === 'supabase' && Backend.setupOk && !Backend.offline;
    if (ready) {
      Anim.boot.set(55, 'Loading…'); // settings, services and the signed-in user load together
      await Promise.all([loadSettings(), DB.getAll('services').then(s => { _svcCache = s; }), Auth.init()]);
    }
    Anim.boot.stage(3); Anim.boot.set(90, 'Opening PetCare…');
    window.addEventListener('hashchange', () => Router.resolve());
    await Router.resolve(); await Anim.boot.done();
    const auto = async () => { try { await Reminders.process(); } catch (e) { console.warn('Reminders skipped:', e.message); } EmailService.flush(); };
    if (ready) { setTimeout(auto, 800); setInterval(() => { if (Auth.user && Auth.isStaff()) auto(); }, 10 * 60000); } // background, after the page is shown; staff keep it running every 10 minutes
    let jc = null; try { jc = localStorage.getItem('petcare:justConnected'); localStorage.removeItem('petcare:justConnected'); } catch (e) { /* ignore */ }
    if (jc && Backend.setupOk) setTimeout(() => UI.toast('Database connected', 'Create the clinic admin account now. The first account becomes the admin.', 'ok', 9000), 600);
  } catch (e) {
    console.error(e); Anim.boot.set(100, 'Could not start');
    $('.boot-card').insertAdjacentHTML('beforeend', `<div class="notice red mt2" style="text-align:left">${icon('alert', 'sm')}<span>PetCare could not start in this browser. Please allow site storage, check your internet connection, or try another browser.</span></div><button class="btn btn-primary mt2" onclick="location.reload()">Try again</button>`);
  }
})();
